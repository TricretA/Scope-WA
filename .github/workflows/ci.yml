name: CI

# Runs on every push to features/main and every PR into main — see CLAUDE.md's
# branch policy. No local Android Studio is required; this pipeline is the
# only thing that has to build the app (architecture doc section 4).
on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test the brain layer
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scope-wa-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
